<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Path tracing denoising workflow</title>
  <desc id="desc">UE5 rendering data is used for SVGF and DLSS baseline comparisons and PyTorch denoiser training. Quality and temporal stability are the evaluation goals.</desc>
