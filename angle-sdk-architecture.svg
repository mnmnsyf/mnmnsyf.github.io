<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">ANGLE graphics SDK architecture</title>
  <desc id="desc">C# and .NET SDK connects to a native C++ EGL bridge, upstream ANGLE, and the GPU.</desc>
  <rect width="960" height="260" fill="#f7f7f7"/>
  <g font-family="Inter, Arial, sans-serif" fill="#1a1a1a">
    <text x="36" y="42" font-size="15" fill="#5c5c5c" letter-spacing="2">NATIVE + MANAGED GRAPHICS</text>
    <g fill="white" stroke="#d9d9d9"><rect x="36" y="78" width="244" height="106" rx="8"/><rect x="330" y="78" width="240" height="106" rx="8"/><rect x="620" y="78" width="190" height="106" rx="8"/></g>
    <g font-size="21" font-weight="600"><text x="56" y="114">C# / .NET SDK</text><text x="350" y="114">C++ EGL bridge</text><text x="640" y="114">ANGLE</text><text x="860" y="136">GPU</text></g>
    <g font-size="15" fill="#5c5c5c"><text x="56" y="143">GLES bindings · GPU resources</text><text x="56" y="165">Thread-access checks</text><text x="350" y="143">Context · surface · presentation</text><text x="350" y="165">Offscreen pixel readback</text><text x="640" y="143">Upstream runtime</text><text x="640" y="165">Graphics backends</text></g>
    <g stroke="#4b55af" stroke-width="2" fill="none"><path d="M288 130h30m-8-6 8 6-8 6"/><path d="M578 130h30m-8-6 8 6-8 6"/><path d="M818 130h28m-8-6 8 6-8 6"/></g>
    <text x="36" y="222" font-size="15" fill="#5c5c5c">Developer tools: hot reload · shader fallback · native / managed image comparison</text>
  </g>
</svg>
